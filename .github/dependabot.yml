# Dependabot proposes dependency updates as pull requests. It never merges
# anything: every PR runs the full test suite and waits for review, same as
# any other change. Security updates (for published advisories) are raised
# as soon as GitHub knows about them, separately from this weekly schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
