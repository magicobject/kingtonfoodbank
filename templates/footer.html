<footer class="site" id="contact">
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <p class="foot-heading">{{ORG_NAME}}</p>
        <p>{{VENUE}}, {{STREET}}<br>{{TOWN}}, {{COUNTY}} {{POSTCODE}}</p>
        <div class="badge-strip">
          <span class="badge">Run by {{RUN_BY}}</span>
        </div>
      </div>
      <div>
        <p class="foot-heading">Opening hours</p>
        <p>{{OPENING_DAY}}s<br>{{OPENING_TIME_DISPLAY}}</p>
      </div>
      <div>
        <p class="foot-heading">Get in touch</p>
        <p><a href="mailto:{{EMAIL}}">{{EMAIL}}</a></p>
        <p><a href="tel:{{PHONE_TEL}}">{{PHONE_DISPLAY}}</a></p>
      </div>
    </div>
    <div class="fine">
      <span>&copy; <span id="year"></span> {{ORG_NAME}}, run by {{RUN_BY}}. Site by <a href="{{MEDIAWRIGHT_HREF}}">{{MEDIAWRIGHT_LABEL}}</a>.</span>
      <span class="build-number">Build {{BUILD_NUMBER}}</span>
    </div>
  </div>
</footer>
